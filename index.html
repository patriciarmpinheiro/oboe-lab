document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

">Another question? Write to me<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ toggleAi }}\" style=\"width:56px; height:56px; border-radius:50%; background:#000181; border:none; color:#D0FFA4; font-size:.58rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; transition:all .35s cubic-bezier(.2,.8,.2,1)\" style-hover=\"background:#006EE9; transform:scale(1.09)\">Ask<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position:fixed; inset:0; z-index:590; pointer-events:none; overflow:hidden\">\n    <sc-for list=\"{{ reeds }}\" as=\"rd\" hint-placeholder-count=\"0\">\n      <span style=\"position:absolute; top:0; left:{{ rd.left }}%; width:11px; height:42px; border-radius:1px 1px 5px 5px; background:linear-gradient(180deg, #F5EBCB 0 26%, #141414 26% 42%, {{ rd.tint }} 42% 100%); box-shadow:inset 0 0 0 1px rgba(0,1,129,.6); scale:{{ rd.scale }}; animation:reedFall {{ rd.dur }}s {{ rd.delay }}s linear both\"><\u002Fspan>\n    <\u002Fsc-for>\n    <sc-for list=\"{{ ripples }}\" as=\"rp\" hint-placeholder-count=\"0\">\n      <span style=\"position:absolute; left:{{ rp.x }}px; top:{{ rp.y }}px; width:{{ rp.size }}px; height:{{ rp.size }}px; border-radius:50%; border:1.5px solid {{ rp.color }}; animation:ripple 1.4s {{ rp.delay }}s cubic-bezier(.15,.8,.2,1) both\"><\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;defaultView&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;composer&quot;, &quot;oboist&quot;, &quot;explorer&quot;], &quot;default&quot;: &quot;composer&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;heroWord&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;OBOE&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Hero&quot; },\n  &quot;heroTags&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Hero&quot; },\n  &quot;showAiChat&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot; },\n  &quot;coffeeUrl&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://buymeacoffee.com/&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Support&quot; },\n  &quot;videoLayout&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;tv&quot;, &quot;wall&quot;], &quot;default&quot;: &quot;tv&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Oboe TV&quot; }\n}\">\nconst TECHS = [\n  { id: 'flutter', name: 'Flutter Tongue', cat: 'som', emoji: '🌀', sub: 'Rolling tremolo of tone colour',\n    desc: 'Produced by rolling an \"r\" (lingual or uvular) while playing. The effect is a rapid fluctuation of tone colour without significant pitch change. Speaks best in the middle register at mf and above.',\n    subs: ['lingual', 'uvular'],\n    composer: 'Notate with three tremolo strokes plus \"flz.\" and mark clearly where it ends. Reliable down to about C4; below that it becomes dense and less stable.',\n    oboist: 'If a rolled R is impossible for you, use the uvular (throat) flutter — slower, but far more controllable. Keep the air speed high or the reed will choke.',\n    fun: 'Roughly one in ten oboists cannot roll an R at all — they build their whole flutter technique in the throat instead.',\n    synth: 'flutter', audioLabel: 'Flutter Tongue A4' },\n  { id: 'multi', name: 'Multiphonics', cat: 'ext', emoji: '🎶', sub: 'Two or more pitches at once',\n    desc: 'Special fingerings and embouchure adjustments make the reed vibrate in several modes at once, producing chords, beatings and rough textures. Each multiphonic has its own fingering, dynamic window and degree of stability.',\n    subs: ['fingered', 'dyads', 'beating'],\n    composer: 'Always print the fingering diagram in the score, and give the player time to set the embouchure — avoid fast approaches from loud tutti passages.',\n    oboist: 'Practise each one at the written dynamic; most only speak in a narrow band. Voicing slightly lower than the bottom note usually helps stability.',\n    fun: 'Over 200 oboe multiphonics have been catalogued — but every reed favours a different subset, so no two oboists share the same menu.',\n    synth: 'multi', audioLabel: 'Multiphonic — stable dyad' },\n  { id: 'harm', name: 'Harmonics', cat: 'reg', emoji: '✨', sub: 'Ethereal overtone colours',\n    desc: 'Overblown fingerings that produce a thin, veiled version of the pitch — a flute-like whisper of the note. Available roughly from C5 upward, sounding an octave or a twelfth above the base fingering.',\n    subs: ['octave', 'twelfth'],\n    composer: 'Notate with a small circle above the note. Best at p–mp in slow music; harmonics will not project over a full orchestra.',\n    oboist: 'Half-hole and voicing control are everything. Think of blowing \"through\" the note rather than at it.',\n    fun: 'Orchestral oboists have quietly used harmonic fingerings for centuries — as secret pianissimo alternatives long before new music asked for them by name.',\n    synth: 'harm', audioLabel: 'Harmonic C6' },\n  { id: 'circ', name: 'Circular Breathing', cat: 'ext', emoji: '🔄', sub: 'Unbroken stream of sound',\n    desc: 'The player inhales through the nose while pushing air stored in the cheeks through the reed, sustaining the sound indefinitely. The oboe needs so little air that it is one of the friendliest instruments for this.',\n    subs: ['sustained', 'drones'],\n    composer: 'You may write phrases of any length — but mark \"circular breathing\" in the part and expect a small colour ripple at each switch.',\n    oboist: 'Start with a straw in a glass of water. The switch is easiest on stable middle-register notes, away from register breaks.',\n    fun: 'Heinz Holliger sustained single notes for minutes on end — the oboe uses so little air that one cheekful covers several switches.',\n    synth: 'circ', audioLabel: 'Sustained D5 — two switches' },\n  { id: 'gliss', name: 'Glissando', cat: 'som', emoji: '🎢', sub: 'Sliding between pitches',\n    desc: 'A continuous slide produced by gradually sliding fingers off the keys, combined with embouchure bending. Ascending glissandi are easier than descending; the key mechanism limits the usable range.',\n    subs: ['finger gliss', 'embouchure'],\n    composer: 'Keep glissandi within a third for reliability, and prefer upward slides. Above the staff, the mechanism makes continuous sliding patchy.',\n    oboist: 'Slide the fingers sideways off the ring keys while relaxing the jaw. Combining finger and embouchure bend gives the widest smooth slide.',\n    fun: 'The famous opening slide of Rhapsody in Blue is a clarinet glissando — the oboe version is much harder, which is exactly why it is fun.',\n    synth: 'gliss', audioLabel: 'Glissando G4 → D5' },\n  { id: 'bend', name: 'Pitch Bend', cat: 'som', emoji: '〰️', sub: 'Micro-inflections of pitch',\n    desc: 'Lipping the pitch up or down — roughly a quarter-tone to a semitone — using embouchure and voicing alone. Ideal for microtonal inflections, \"blue\" notes and expressive ornaments.',\n    subs: ['quarter-tones', 'wide vibrato'],\n    composer: 'Quarter-tone bends are safe anywhere; a full semitone only works in the middle register at moderate dynamics.',\n    oboist: 'Drop the jaw and lower the tongue to bend down — think \"ee\" to \"aw\". Bending up is much harder; approach from below instead.',\n    fun: 'Baroque oboists bent pitch constantly as a matter of style — equal temperament is younger than the instrument itself.',\n    synth: 'bend', audioLabel: 'Bend A4 — quarter-tone dip' },\n  { id: 'keys', name: 'Key Clicks', cat: 'ext', emoji: '🥁', sub: 'Percussive key noise',\n    desc: 'The keys are slapped without blowing — or with air only — turning the oboe into a quiet percussion instrument with faint pitch shadows of the fingerings.',\n    subs: ['pitched', 'with air'],\n    composer: 'Very quiet — amplify, or score them in silence. Use x-noteheads at the fingering pitch to control the colour of each click.',\n    oboist: 'The low C, B and B♭ keys give the loudest clicks. Adding a breathy \"huh\" of air doubles the presence.',\n    fun: 'Unamplified key clicks carry barely ten metres in a hall — intimacy is the whole point of the effect.',\n    synth: 'keys', audioLabel: 'Key clicks — low C pattern' },\n  { id: 'air', name: 'Air Sounds', cat: 'som', emoji: '💨', sub: 'Breath through the instrument',\n    desc: 'Blowing air through the instrument without engaging the reed — from pure white-noise breath to half-tone mixtures where a shadow of pitch appears inside the noise.',\n    subs: ['pure air', 'half-tone'],\n    composer: 'Notate air with a triangle notehead and specify the consonant — \"ss\", \"ff\" or \"sh\" — since each filters the noise differently.',\n    oboist: 'Loosen the embouchure until the reed just stops speaking; the fingering still colours the noise, so change fingerings expressively.',\n    fun: 'The oboe\\u2019s narrow bore makes its air sounds the most \"whistly\" of all the woodwinds.',\n    synth: 'air', audioLabel: 'Air sound — half-tone' },\n  { id: 'cor', name: 'Cor Anglais: Low Register', cat: 'cor', emoji: '🌑', sub: 'The dark voice of the cor anglais',\n    desc: 'The bottom fifth of the cor anglais — written B3 down to E3, sounding a fifth lower — has a covered, reedy darkness the oboe cannot reach. Slow to speak, enormous in colour.',\n    subs: ['sung lines', 'drones'],\n    composer: 'Approach the lowest notes by step and give them time — attacks below written G3 are slow at pp. Unbeatable for lament-like solos.',\n    oboist: 'Use a slightly heavier reed and think warm, slow air. Practise pp attacks daily; they are this register\\u2019s whole craft.',\n    fun: 'The cor anglais is neither English nor a horn — \"anglais\" is probably a corruption of \"angl\\u00e9\" (angled), after its old curved shape.',\n    synth: 'low', audioLabel: 'Cor anglais low F3' }\n];\n\nconst NOTE_EN = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];\n\nconst CATS = {\n  som: { label: 'Sound & Timbre', color: '#E8A0FF', tile: '#f6e6ff' },\n  ext: { label: 'Extended Technique', color: '#006EE9', tile: '#dceaff' },\n  reg: { label: 'Register', color: '#83E7FF', tile: '#e2f8ff' },\n  cor: { label: 'Cor Anglais', color: '#D0FFA4', tile: '#eeffdc' }\n};\n\nconst PAIRS = {\n  'circ|flutter': { stars: 5, emoji: '🔥', label: 'Advanced — very effective', notes: 'A continuous, pulsating stream of colour that never breathes. Demands real stamina — stunning in slow builds.' },\n  'flutter|multi': { stars: 4, emoji: '🌪️', label: 'Dense & turbulent', notes: 'A rough, buzzing chord-noise. Only the most stable multiphonics survive the flutter — pick them together with your player.' },\n  'bend|gliss': { stars: 5, emoji: '🎢', label: 'Seamless — expressive gold', notes: 'Finger glissando plus embouchure bend covers the widest smooth slides the oboe can make. A natural marriage.' },\n  'air|keys': { stars: 5, emoji: '👻', label: 'Ghost machine', notes: 'Percussive clicks inside a halo of breath — a whole quiet ensemble from a single player. Amplify for magic.' },\n  'harm|multi': { stars: 2, emoji: '🫧', label: 'Fragile — handle with care', notes: 'Both need precise voicing, and combining them usually collapses one or the other. Alternate rather than superimpose.' },\n  'cor|flutter': { stars: 4, emoji: '🐻', label: 'Dark growl', notes: 'Flutter in the cor anglais low register is a slow, furry rumble — one of the darkest colours in the double-reed family.' },\n  'air|cor': { stars: 4, emoji: '🌫️', label: 'Deep fog', notes: 'Air sounds through the cor anglais are lower and rounder than on oboe — a warm, distant wind. Beautiful in transitions.' },\n  'circ|gliss': { stars: 4, emoji: '🌀', label: 'Endless spiral', notes: 'An unbroken slide that keeps circling without a breath. Keep the range modest and it hypnotises.' },\n  'bend|multi': { stars: 4, emoji: '🌊', label: 'Beating clouds', notes: 'Bending one component of a multiphonic creates slow beating waves — a favourite of spectral writing.' },\n  'flutter|keys': { stars: 3, emoji: '🪵', label: 'Workable — rhythmic grit', notes: 'Alternating flutter bursts with key clicks makes a nice grainy groove; superimposing them buries the clicks.' },\n  'air|harm': { stars: 4, emoji: '🕊️', label: 'Veiled whisper', notes: 'A harmonic emerging from inside an air sound is one of the most delicate entrances the oboe can make.' },\n  'bend|harm': { stars: 3, emoji: '🌙', label: 'Delicate — narrow window', notes: 'Harmonics can be bent, but only slightly — a few cents of shimmer rather than a true slide.' },\n  'circ|multi': { stars: 4, emoji: '🐝', label: 'The infinite swarm', notes: 'A sustained multiphonic with no breaths — a swarm that never lands. Choose a very stable multiphonic.' }\n};\n\nconst DEFAULT_TEXTS = {\n  heroBadge: 'Patrícia Pinheiro · oboe & cor anglais',\n  heroSub: 'An interactive reference for composers and performers — extended techniques, multiphonics and the full sonic world of the oboe and cor anglais.',\n  ticker: ['EXTENDED TECHNIQUES', 'MULTIPHONICS', 'FLUTTER TONGUE', 'CIRCULAR BREATHING', 'AIR SOUNDS', 'KEY CLICKS', 'GLISSANDO', 'HARMONICS', 'COR ANGLAIS'],\n  podSub: 'Scroll the wheel, pick a technique, press play. Where a real recording exists it plays automatically — the rest are synthesised sketches for now.',\n  techniquesSub: 'Browse and filter by category — open a row for notation, practice notes and recordings.',\n  mixSub: 'Pick two techniques and see how well they get along.',\n  tvSub: 'Reels, seagull sounds and experiments — zapping encouraged.',\n  coffeeTitle: 'Buy me a reed',\n  coffeeSub: 'This playground is built and recorded by one oboist, between rehearsals. A coffee (or a piece of cane) keeps the recordings, the multiphonic analyses and the whole archive growing — and free for everyone.',\n  contactSub: \"Commissions, recordings, questions about a passage you're writing — or just to say your multiphonic finally spoke.\",\n  footerLine: 'Curated by Patrícia Pinheiro — oboe & cor anglais'\n};\n\nconst HERO_TAGS = [\n  { label: 'flutter tongue', top: 20, left: 16, par: 0.12, anim: 'drift1 12s ease-in-out infinite' },\n  { label: 'multiphonics', top: 32, left: 74, par: -0.14, anim: 'drift2 15s ease-in-out infinite' },\n  { label: 'circular breathing', top: 72, left: 20, par: 0.16, anim: 'drift3 17s ease-in-out infinite' },\n  { label: 'key clicks', top: 76, left: 62, par: -0.1, anim: 'drift1 14s ease-in-out infinite' },\n  { label: 'air sounds', top: 10, left: 68, par: 0.09, anim: 'drift2 19s ease-in-out infinite' },\n  { label: 'harmonics', top: 56, left: 84, par: -0.16, anim: 'drift3 13s ease-in-out infinite' }\n];\n\nconst RIPPLE_COLORS = ['#000181', '#006EE9', '#E8A0FF', '#F6F5EC'];\n\nclass Component extends DCLogic {\n  state = {\n    view: null, filter: 'all', search: '',\n    modalId: null, playing: false, selIdx: 0,\n    mixA: null, mixB: null, ripples: [], reeds: [],\n    recordings: {}, videos: [], tvIdx: 0, tvStatic: false, videoMode: null,\n    aiOpen: false, aiBusy: false,\n    faq: [], multis: [],\n    aiMsgs: [{ role: 'bot', text: 'Hello! Pick a question below — or write to Patrícia through the form.' }]\n  };\n\n  componentDidMount() {\n    this._esc = (e) => { if (e.key === 'Escape') this.setState({ modalId: null }); };\n    window.addEventListener('keydown', this._esc);\n\n    this._move = (e) => {\n      const hero = document.getElementById('top');\n      if (!hero) return;\n      const r = hero.getBoundingClientRect();\n      if (e.clientY > r.bottom) return;\n      const cx = e.clientX - r.left - r.width / 2;\n      const cy = e.clientY - r.top - r.height / 2;\n      const glow = document.getElementById('hero-glow');\n      if (glow) glow.style.transform = 'translate(' + (e.clientX - r.left) + 'px,' + (e.clientY - r.top) + 'px)';\n      hero.querySelectorAll('[data-par]').forEach((el) => {\n        const p = parseFloat(el.getAttribute('data-par')) || 0;\n        el.style.translate = (cx * p).toFixed(1) + 'px ' + (cy * p).toFixed(1) + 'px';\n      });\n    };\n    window.addEventListener('mousemove', this._move, { passive: true });\n\n    const load = (f, fn) => fetch(f).then((r) => r.json()).then(fn).catch(() => {});\n    load('data/recordings.json', (recordings) => this.setState({ recordings }));\n    load('data/videos.json', (v) => Array.isArray(v) && this.setState({ videos: v }));\n    load('data/faq.json', (f) => Array.isArray(f) && this.setState({ faq: f }));\n    load('data/techniques.json', (t) => Array.isArray(t) && t.length && this.setState({ techsData: t }));\n    load('data/categories.json', (c) => Array.isArray(c) && c.length && this.setState({ catsData: c }));\n    load('data/site-texts.json', (t) => t && typeof t === 'object' && this.setState({ texts: t }));\n    load('data/multiphonics.json', (m) => Array.isArray(m) && this.setState({ multis: m }));\n    load('data/pairs.json', (p) => Array.isArray(p) && p.length && this.setState({ pairsData: p }));\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('keydown', this._esc);\n    window.removeEventListener('mousemove', this._move);\n  }\n\n  pairsMap() {\n    const d = this.state.pairsData;\n    if (!d || !d.length) return PAIRS;\n    const m = {};\n    d.forEach((p) => { m[[p.a, p.b].sort().join('|')] = { stars: p.stars, emoji: p.emoji, label: p.label, notes: p.notes }; });\n    return m;\n  }\n\n  get C() {\n    const d = this.state.catsData;\n    if (!d || !d.length) return CATS;\n    const m = {};\n    d.forEach((c) => { m[c.id] = c; });\n    return m;\n  }\n\n  get T() {\n    const d = this.state.techsData;\n    if (!d || !d.length) return TECHS;\n    return d.map((t) => ({ ...(TECHS.find((b) => b.id === t.id) || {}), ...t }));\n  }\n\n  recsFor(id) {\n    const r = (this.state.recordings || {})[id];\n    if (!r) return [];\n    return Array.isArray(r) ? r.filter((x) => x && x.file) : [{ file: r, label: 'Recording', instrument: '', notes: '' }];\n  }\n\n  rainReeds(n) {\n    const count = n || 34;\n    const reeds = [];\n    for (let i = 0; i < count; i++) {\n      reeds.push({\n        id: Date.now() + '-' + i,\n        left: (Math.random() * 98).toFixed(1),\n        dur: (2.6 + Math.random() * 2.6).toFixed(2),\n        delay: (Math.random() * 1.3).toFixed(2),\n        scale: (0.6 + Math.random() * 0.9).toFixed(2),\n        tint: ['#E9C79B', '#D9B27C', '#F0D8B4'][i % 3]\n      });\n    }\n    this.setState({ reeds });\n    clearTimeout(this._reedT);\n    this._reedT = setTimeout(() => this.setState({ reeds: [] }), 6200);\n  }\n\n  spawnRipples(x, y) {\n    const ripples = [];\n    for (let i = 0; i < 4; i++) {\n      ripples.push({\n        id: Date.now() + '-' + i, x, y,\n        size: 160 + i * 190,\n        delay: (i * 0.11).toFixed(2),\n        color: RIPPLE_COLORS[i % RIPPLE_COLORS.length]\n      });\n    }\n    this.setState({ ripples });\n    clearTimeout(this._rt);\n    this._rt = setTimeout(() => this.setState({ ripples: [] }), 2000);\n  }\n\n  heroTap(e) {\n    if (e.target.closest('a, button, input')) return;\n    this.spawnRipples(e.clientX, e.clientY);\n    this.playSynth(this.T[Math.floor(Math.random() * this.T.length)]);\n  }\n\n  playRecording(src) {\n    if (this._audio) {\n      this._audio.pause();\n      this._audio = null;\n      if (this.state.playing) { this.setState({ playing: false }); return; }\n    }\n    const a = new Audio(src);\n    this._audio = a;\n    a.onended = () => { this._audio = null; this.setState({ playing: false }); };\n    a.play().catch(() => {});\n    this.setState({ playing: true });\n  }\n\n  zapTo(i) {\n    if (i === this.state.tvIdx) return;\n    this.setState({ tvStatic: true });\n    clearTimeout(this._zt);\n    this._zt = setTimeout(() => this.setState({ tvIdx: i, tvStatic: false }), 340);\n  }\n\n  zap(dir) {\n    const n = (this.state.videos || []).length;\n    if (!n) return;\n    this.zapTo((this.state.tvIdx + dir + n) % n);\n  }\n\n  openTech(id) { this.setState({ modalId: id, playing: false }); }\n\n  angleAt(el, e) {\n    const r = el.getBoundingClientRect();\n    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));\n  }\n\n  wheelDown(e) {\n    if (e.target.closest('button')) return;\n    const el = e.currentTarget;\n    this._drag = { last: this.angleAt(el, e), acc: 0, el, moved: false };\n    if (el.setPointerCapture) { try { el.setPointerCapture(e.pointerId); } catch (err) {} }\n    this.setState({ dragging: true });\n  }\n\n  wheelMove(e) {\n    const d = this._drag;\n    if (!d) return;\n    let a = this.angleAt(d.el, e);\n    let delta = a - d.last;\n    if (delta > Math.PI) delta -= Math.PI * 2;\n    if (delta < -Math.PI) delta += Math.PI * 2;\n    d.last = a;\n    d.acc += delta;\n    const step = 0.42;\n    while (Math.abs(d.acc) >= step) {\n      const dir = d.acc > 0 ? 1 : -1;\n      d.acc -= dir * step;\n      d.moved = true;\n      this.movePod(dir);\n      this.tick();\n    }\n  }\n\n  wheelUp() {\n    this._drag = null;\n    if (this.state.dragging) this.setState({ dragging: false });\n  }\n\n  tick() {\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      this._ac = this._ac || new AC();\n      const ac = this._ac;\n      if (ac.state === 'suspended') ac.resume();\n      const now = ac.currentTime;\n      const g = ac.createGain();\n      g.connect(ac.destination);\n      g.gain.setValueAtTime(0.06, now);\n      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);\n      const o = ac.createOscillator();\n      o.type = 'square';\n      o.frequency.setValueAtTime(1900, now);\n      o.connect(g);\n      o.start(now);\n      o.stop(now + 0.05);\n    } catch (err) {}\n  }\n\n  shuffleMix() {\n    const T = this.T;\n    if (T.length < 2) return;\n    let a = Math.floor(Math.random() * T.length);\n    let b = Math.floor(Math.random() * T.length);\n    while (b === a) b = Math.floor(Math.random() * T.length);\n    this.setState({ mixA: T[a].id, mixB: T[b].id });\n  }\n\n  movePod(dir) {\n    const n = this.T.length;\n    this.setState({ selIdx: (this.state.selIdx + dir + n) % n });\n  }\n\n  playSynth(t) {\n    const recs = this.recsFor(t.id);\n    if (recs.length) { this.playRecording(recs[0].file); return; }\n    try {\n      const AC = window.AudioContext || window.webkitAudioContext;\n      this._ac = this._ac || new AC();\n      const ac = this._ac;\n      if (ac.state === 'suspended') ac.resume();\n      const now = ac.currentTime, dur = 1.9;\n      const g = ac.createGain();\n      g.connect(ac.destination);\n      g.gain.setValueAtTime(0.0001, now);\n      g.gain.exponentialRampToValueAtTime(0.16, now + 0.06);\n      g.gain.setValueAtTime(0.16, now + dur - 0.35);\n      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);\n      const osc = (type, f) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, now); return o; };\n      const noise = () => {\n        const buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);\n        const d = buf.getChannelData(0);\n        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;\n        const s = ac.createBufferSource(); s.buffer = buf; return s;\n      };\n      const start = (n) => { n.start(now); n.stop(now + dur); };\n      switch (t.synth) {\n        case 'flutter': {\n          const o = osc('sawtooth', 440); o.connect(g); start(o);\n          const lfo = osc('sine', 26), lg = ac.createGain(); lg.gain.value = 0.10;\n          lfo.connect(lg); lg.connect(g.gain); start(lfo);\n
