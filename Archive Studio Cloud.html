document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ment Serif',serif; font-weight:400; font-size:clamp(2.2rem,6vw,3.8rem); line-height:.96; color:#F6F5EC; margin:0; text-align:center\">ARCHIVE <span style=\"color:#D0FFA4\">STUDIO<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:.9rem; line-height:1.7; color:rgba(246,245,236,.75); max-width:430px; text-align:center; margin:18px 0 30px\">Liga-te ao repositório do site. O Studio lê e escreve <span style=\"color:#D0FFA4\">data/tecnicas.json<\u002Fspan> directamente no GitHub — funciona no Mac, no iPad, em qualquer browser.<\u002Fp>\n\n      <div style=\"width:100%; max-width:520px; background:#F6F5EC; border:3px solid #000181; box-shadow:9px 9px 0 #006EE9; padding:24px\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px\">\n          <label style=\"display:flex; flex-direction:column; gap:5px\">\n            <span style=\"font-weight:700; font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(0,1,129,.55)\">Utilizador GitHub<\u002Fspan>\n            <input type=\"text\" value=\"{{ cfgOwner }}\" sc-camel-on-change=\"{{ setOwner }}\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" style=\"background:#fff; border:2px solid #000181; color:#000181; padding:10px 11px; outline:none\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:5px\">\n            <span style=\"font-weight:700; font-size:.58rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(0,1,129,.55)\">Repositório<\u002Fspan>\n            <input type=\"text\" value=\"{{ cfgRepo }}\" sc-camel-on-change=\"{{ setRepo }}\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\" style=\"background:#fff; border:2px solid #000181; color:#000181; padding:10px 11px; outline:none\">\n          <\u002Flabel>\n          <label style=\"display:flex; flex-direction:column; gap:5px\">\n            <span style=\"font-weight:700; font-size:.58rem; letter-spacing:.14em; text-transfo -on-click=\"{{ save }}\" style=\"font-weight:700; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:#000181; background:#D0FFA4; border:2px solid #000181; box-shadow:3px 3px 0 #F6F5EC; padding:10px 14px; cursor:pointer\">Guardar no GitHub<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ publish }}\" style=\"font-weight:700; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:#F6F5EC; background:#006EE9; border:2px solid #000181; box-shadow:3px 3px 0 #F6F5EC; padding:10px 14px; cursor:pointer\">Publicar site<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n  <sc-if value=\"{{ fpOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:900; background:rgba(0,1,129,.85); display:flex; align-items:center; justify-content:center; padding:16px\">\n      <div style=\"background:#F6F5EC; border:3px solid #000181; box-shadow:10px 10px 0 #006EE9; width:min(620px,100%); max-height:92vh; display:flex; flex-direction:column\">\n        <div style=\"display:flex; align-items:center; gap:10px; background:#000181; padding:11px 14px\">\n          <span style=\"flex:1; font-family:'Instrument Serif',serif; font-size:1rem; color:#F6F5EC\">Criador de dedilhação — {{ fpTitle }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ fpClose }}\" style=\"font-weight:700; font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:#000181; background:#D0FFA4; border:2px solid #F6F5EC; padding:7px 10px; cursor:pointer\">fechar<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0; padding:9px 14px; font-size:.72rem; color:rgba(0,1,129,.65); border-bottom:2px solid #000181\">Desenha e carrega em <strong>↑ Use this fingering<\u002Fstrong> — a imagem é enviada para o repositório e ligada a esta ficha.<\u002Fp>\n        <iframe ref=\"{{ fpFrame }}\" src=\"about:blank#83af634e-500b-4ae6-807d-8acbe21fc9fc\" title=\"Fingering Creator\" style=\"flex:1; width:100%; min-height:520px; border:none; background:#FFFBF9\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{}}\">\nconst CFG_KEY = 'oboe_archive_studio_cfg_v1';\nconst INSTR = ['oboe', 'cor anglais'];\nconst MF_CAT = ['beating', 'double harmonic', 'honky'];\nconst MF_STABLE = ['yes', 'no'];\nconst MP_LINK = ['trill', 'tremolo', 'glissando', 'sequence', 'same fingering', 'combination'];\n\nfunction b64enc(str) {\n  const bytes = new TextEncoder().encode(str);\n  let bin = '';\n  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);\n  return btoa(bin);\n}\nfunction b64dec(str) {\n  const bin = atob(String(str || '').replace(/\\s/g, ''));\n  const bytes = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n  return new TextDecoder().decode(bytes);\n}\n\nclass Component extends DCLogic {\n  state = {\n    cfg: { owner: 'patriciarmpinheiro', repo: 'oboe-lab', branch: 'main', path: 'data/tecnicas.json', token: '', hook: '' },\n    connected: false, busy: '', err: '', notice: '',\n    data: null, sha: null, dirty: false,\n    tab: 'tech', sub: 'detail', selTech: 0,\n    fpOpen: false, fpApply: null, fpInst: 'oboe', fpPitch: '', fpTitle: ''\n  };\n  onFingering = (e) => {\n    const d = e.data || {};\n    if (!d || d.type !== 'fingeringReady' || !this.state.fpApply) return;\n    const apply = this.state.fpApply;\n    const slug = this.safeName((d.pitch || '').replace(/♭/g, 'b').replace(/♯/g, 's')) || 'x';\n    const file = new File([d.svg], 'fingering-' + slug + '-' + Date.now().toString(36) + '.svg', { type: 'image/svg+xml' });\n    this.setState({ fpOpen: false, fpApply: null });\n    this.pickUpload({ target: { files: [file], value: '' } }, 'images', apply, false);\n  };\n\n  componentDidMount() {\n    window.addEventListener('message', this.onFingering);\n    let cfg = this.state.cfg;\n    try {\n      const raw = localStorage.getItem(CFG_KEY);\n      if (raw) { cfg = { ...cfg, ...JSON.parse(raw) }; this.setState({ cfg }); }\n    } catch (e) { /* ignore */ }\n    if (cfg.token && cfg.owner && cfg.repo) setTimeout(() => this.connect(), 60);\n  }\n\n  componentWillUnmount() { window.removeEventListener('message', this.onFingering); }\n\n  setCfg(k, v) {\n    const cfg = { ...this.state.cfg, [k]: v };\n    this.setState({ cfg });\n    try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) { /* ignore */ }\n  }\n\n  url() {\n    const c = this.state.cfg;\n    return 'https://api.github.com/repos/' + encodeURIComponent(c.owner.trim()) + '/' + encodeURIComponent(c.repo.trim()) + '/contents/' + c.path.trim().replace(/^\\/+/, '');\n  }\n  headers() {\n    return {\n      Authorization: 'Bearer ' + this.state.cfg.token.trim(),\n      Accept: 'application/vnd.github+json',\n      'X-GitHub-Api-Version': '2022-11-28'\n    };\n  }\n\n  skeleton() {\n    return { version: 1, updated: new Date().toISOString(), categories: [], techniques: [], recordings: {}, videos: [], multiphonics: [], mpLinks: [], pairs: [], faq: [], texts: {} };\n  }\n  normalize(d) {\n    const s = this.skeleton();\n    const out = { ...s, ...(d || {}) };\n    ['categories', 'techniques', 'videos', 'multiphonics', 'pairs', 'faq'].forEach((k) => { if (!Array.isArray(out[k])) out[k] = []; });\n    if (!out.recordings || typeof out.recordings !== 'object' || Array.isArray(out.recordings)) out.recordings = {};\n    if (!out.texts || typeof out.texts !== 'object') out.texts = {};\n    if (!Array.isArray(out.texts.ticker)) out.texts.ticker = [];\n    out.techniques = out.techniques.map((t) => ({\n      subs: [], fingerings: [], variations: [], videos: [], ...t,\n      variations: Array.isArray(t.variations) ? t.variations : (t.fingerings || []).map((f, i) => ({ name: f.name || 'Variação ' + (i + 1), instrument: INSTR[0], note: '', fingering: '', image: f.image || '', notes: '' })),\n      videos: Array.isArray(t.videos) ? t.videos : []\n    }));\n    out.mpLinks = (Array.isArray(out.mpLinks) ? out.mpLinks : []).map((l) => ({\n      id: '', a: '', b: '', type: MP_LINK[0], audio: '', notes: '', ...l\n    }));\n    out.multiphonics = out.multiphonics.map((m) => ({\n      id: '', name: '', tech: '', instrument: INSTR[0], fingering: '', fingeringImage: '',\n      images: [], pitches: '', dynamic: '', category: '', stable: '', difficulty: '', audio: '', notes: '',\n      ...m,\n      name: m.name || m.label || '',\n      images: Array.isArray(m.images) ? m.images : (m.image ? [m.image] : [])\n    }));\n    return out;\n  }\n\n  async connect() {\n    const c = this.state.cfg;\n    if (!c.owner.trim() || !c.repo.trim() || !c.token.trim()) {\n      this.setState({ err: 'Preenche utilizador, repositório e token.' });\n      return;\n    }\n    this.setState({ busy: 'load', err: '', notice: '' });\n    try {\n      const res = await fetch(this.url() + '?ref=' + encodeURIComponent(c.branch.trim() || 'main') + '&t=' + Date.now(), { headers: this.headers(), cache: 'no-store' });\n      if (res.status === 404) {\n        this.setState({ connected: true, data: this.skeleton(), sha: null, dirty: true, busy: '', notice: 'O ficheiro ainda não existe no repositório — ao guardar, é criado.' });\n        return;\n      }\n      if (res.status === 401 || res.status === 403) throw new Error('Token recusado (' + res.status + '). Confirma que tem Contents: read and write neste repositório e que não expirou.');\n      if (!res.ok) throw new Error('GitHub respondeu ' + res.status + '. Confirma utilizador, repositório e branch.');\n      const j = await res.json();\n      const data = this.normalize(JSON.parse(b64dec(j.content)));\n      this.setState({ connected: true, data, sha: j.sha, dirty: false, busy: '', err: '', notice: '' });\n    } catch (e) {\n      this.setState({ busy: '', err: (e && e.message) || 'Falhou a ligação ao GitHub.' });\n    }\n  }\n\n  async save() {\n    const c = this.state.cfg;\n    this.setState({ busy: 'save', notice: '' });\n    const payload = { ...this.state.data, updated: new Date().toISOString() };\n    payload.multiphonics = (payload.multiphonics || []).map((m) => ({\n      ...m, name: [m.pitches, m.category].filter(Boolean).join(' · ') || 'Multiphonic'\n    }));\n    try {\n      const body = {\n        message: 'Archive Studio: atualização do arquivo',\n        content: b64enc(JSON.stringify(payload, null, 2)),\n        branch: c.branch.trim() || 'main'\n      };\n      if (this.state.sha) body.sha = this.state.sha;\n      const res = await fetch(this.url(), { method: 'PUT', headers: { ...this.headers(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n      if (res.status === 409 || res.status === 422) throw new Error('O ficheiro mudou no GitHub entretanto. Carrega em Recarregar e volta a fazer as alterações.');\n      if (!res.ok) {\n        let why = '';\n        try { const j = await res.json(); why = j.message || ''; } catch (e2) { /* sem corpo */ }\n        if (res.status === 403) why = (why || 'sem permissão') + ' — o token só tem leitura; em Settings › Developer settings › Fine-grained tokens dá-lhe Contents: Read and write';\n        throw new Error('Não guardou (' + res.status + ')' + (why ? ': ' + why : '.'));\n      }\n      const j = await res.json();\n      this.setState({ data: payload, sha: (j.content && j.content.sha) || this.state.sha, dirty: false, busy: '', notice: 'Guardado no GitHub às ' + new Date().toLocaleTimeString('pt-PT') + '.' });\n    } catch (e) {\n      this.setState({ busy: '', notice: (e && e.message) || 'Não guardou.' });\n    }\n  }\n\n  async publish() {\n    const hook = (this.state.cfg.hook || '').trim();\n    if (!hook) { this.setState({ notice: 'Não há build hook configurado — abre ⚙︎ e cola o URL do Netlify.' }); return; }\n    this.setState({ busy: 'pub', notice: '' });\n    try {\n      await fetch(hook, { method: 'POST', mode: 'no-cors', body: '{}' });\n      this.setState({ busy: '', notice: 'Publicação pedida ao Netlify — o site fica atualizado dentro de um minuto ou dois.' });\n    } catch (e) {\n      this.setState({ busy: '', notice: 'Não consegui contactar o Netlify. Confirma o URL do build hook.' });\n    }\n  }\n\n  safeName(n) {\n    return String(n || 'file').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')\n      .toLowerCase().replace(/[^a-z0-9.\\-_]+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');\n  }\n  async uploadOne(folder, file) {\n    const c = this.state.cfg;\n    const base = this.safeName(file.name);\n    const path = folder + '/' + base;\n    const buf = new Uint8Array(await file.arrayBuffer());\n    let bin = '';\n    for (let i = 0; i < buf.length; i += 8192) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));\n    const url = 'https://api.github.com/repos/' + encodeURIComponent(c.owner.trim()) + '/' + encodeURIComponent(c.repo.trim()) + '/contents/' + path;\n    let sha = null;\n    try {\n      const head = await fetch(url + '?ref=' + encodeURIComponent(c.branch.trim() || 'main') + '&t=' + Date.now(), { headers: this.headers(), cache: 'no-store' });\n      if (head.ok) sha = (await head.json()).sha;\n    } catch (e) { /* novo ficheiro */ }\n    const body = { message: 'Archive Studio: upload ' + path, content: btoa(bin), branch: c.branch.trim() || 'main' };\n    if (sha) body.sha = sha;\n    const res = await fetch(url, { method: 'PUT', headers: { ...this.headers(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n    if (!res.ok) {\n      let why = '';\n      try { const j = await res.json(); why = j.message || ''; } catch (e) { /* sem corpo */ }\n      throw new Error('Upload falhou (' + res.status + ') em ' + path + (why ? ' — ' + why : ''));\n    }\n    return path;\n  }\n  async pickUpload(e, folder, apply, multiple) {\n    const files = Array.from(e.target.files || []);\n    e.target.value = '';\n    if (!files.length) return;\n    this.setState({ busy: 'up', notice: 'a enviar ' + files.length + ' ficheiro(s) para ' + folder + '/…' });\n    try {\n      const paths = [];\n      for (const f of files) paths.push(await this.uploadOne(folder, f));\n      apply(multiple ? paths : paths[0]);\n      this.setState({ busy: '', notice: 'Enviado: ' + paths.join(', ') + ' — falta Guardar para gravar o arquivo.' });\n    } catch (err) {\n      this.setState({ busy: '', notice: (err && err.message) || 'Upload falhou.' });\n    }\n  }\n\n  upd(fn) {\n    const d = JSON.parse(JSON.stringify(this.state.data));\n    fn(d);\n    this.setState({ data: d, dirty: true });\n  }\n\n  renderVals() {\n    const s = this.state, c = s.cfg, d = s.data;\n    const F = (label, value, set, kind, options, up) => ({\n      label, value: value == null ? '' : value,\n      onChange: (e) => set(e.target.value),\n      isText: kind !== 'select', isSelect: kind === 'select',\n      options: (options || []).map((o) => (typeof o === 'string' ? { value: o, label: o } : o)),\n      hasUpload: !!up,\n      uploadLabel: up ? (up.multiple ? '↑ enviar ficheiros' : '↑ enviar ficheiro') : '',\n      accept: up ? (up.accept || '') : '',\n      multiple: !!(up && up.multiple),\n      onFile: up ? ((e) => this.pickUpload(e, up.folder, up.apply || set, up.multiple)) : (() => {}),\n      hasDraw: !!(up && up.draw),\n      onDraw: up && up.draw ? (() => this.setState({ fpOpen: true, fpApply: up.apply || set, fpInst: up.draw.instrument || 'oboe', fpPitch: up.draw.pitch || '', fpTitle: up.draw.title || 'Dedilhação' })) : (() => {})\n    });\n    const UP_AUDIO = (apply) => ({ folder: 'audio', accept: 'audio/*', apply });\n    const UP_IMG = (apply, multiple) => ({ folder: 'images', accept: 'image/*', apply, multiple });\n    const UP_FING = (apply, draw) => ({ folder: 'images', accept: 'image/*', apply, draw: draw || {} });\n    const A = (label, value, set) => ({ label, value: value == null ? '' : value, onChange: (e) => set(e.target.value) });\n\n    const base = {\n      notConnected: !s.connected, connected: s.connected,\n      cfgOwner: c.owner, cfgRepo: c.repo, cfgBranch: c.branch, cfgToken: c.token, cfgHook: c.hook, cfgPath: c.path,\n      setOwner: (e) => this.setCfg('owner', e.target.value),\n      setRepo: (e) => this.setCfg('repo', e.target.value),\n      setBranch: (e) => this.setCfg('branch', e.target.value),\n      setToken: (e) => this.setCfg('token', e.target.value),\n      setHook: (e) => this.setCfg('hook', e.target.value),\n      setPath: (e) => this.setCfg('path', e.target.value),\n      connect: () => this.connect(),\n      connectLabel: s.busy === 'load' ? 'a ligar…' : 'Ligar e carregar arquivo',\n      err: s.err,\n      reload: () => this.connect(),\n      save: () => this.save(),\n      publish: () => this.publish(),\n      openCfg: () => this.setState({ connected: false, err: '' }),\n      notice: s.notice,\n      repoLabel: c.owner + '/' + c.repo + ' · ' + c.branch + ' · ' + c.path,\n      statusMsg: s.busy === 'save' ? 'a guardar…' : (s.busy === 'load' ? 'a carregar…' : (s.busy === 'pub' ? 'a publicar…' : (s.dirty ? 'alterações não guardadas' : 'sincronizado'))),\n      statusBg: s.dirty && !s.busy ? '#FFD166' : '#D0FFA4',\n      footMsg: s.dirty ? 'Tens alterações que ainda não estão no GitHub.' : 'Tudo o que vês está gravado no repositório.'\n    };\n    if (!s.connected || !d) return { ...base, fpOpen: false, fpClose: () => {}, fpFrame: () => {}, fpTitle: '', tabs: [], techList: [], subTabs: [], rows: [], catRows: [], tickRows: [], defFields: [], defAreas: [], techFields: [], techAreas: [], subRows: [] };\n\n    const techs = d.techniques;\n    const cats = d.categories;\n    const catOpts = cats.map((x) => ({ value: x.id, label: x.label || x.id }));\n    const techOpts = techs.map((t) => ({ value: t.id, label: t.name || t.id }));\n    const selIdx = Math.min(s.selTech, Math.max(techs.length - 1, 0));\n    const sel = techs[selIdx] || null;\n\n    const listRows = (get, set, titleFn, fieldsFn, areasFn) => get().map((it, i) => {\n      const up = (k) => (v) => set(get().map((x, j) => (j === i ? { ...x, [k]: v } : x)));\n      return {\n        num: String(i + 1).padStart(2, '0'),\n        title: titleFn(it, i),\n        onUp: () => { const a = get().slice(); if (i > 0) { const t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; set(a); } },\n        onDown: () => { const a = get().slice(); if (i < a.length - 1) { const t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; set(a); } },\n        onDel: () => set(get().filter((_, j) => j !== i)),\n        fields: fieldsFn(it, up, i),\n        areas: areasFn ? areasFn(it, up, i) : []\n      };\n    });\n\n    // ── técnicas ──\n    const patchTech = (k) => (v) => this.upd((dd) => { dd.techniques[selIdx][k] = v; });\n    const techFields = sel ? [\n      F('Nome', sel.name, patchTech('name')),\n      F('Identificador (id)', sel.id, patchTech('id')),\n      F('Emoji', sel.emoji, patchTech('emoji')),\n      F('Categoria', sel.cat, patchTech('cat'), 'select', catOpts),\n      F('Subtítulo', sel.sub, patchTech('sub')),\n      F('Sub-tipos (separados por vírgula)', (sel.subs || []).join(', '), (v) => this.upd((dd) => { dd.techniques[selIdx].subs = v.split(',').map((x) => x.trim()).filter(Boolean); })),\n      F('Som sintetizado (synth)', sel.synth, patchTech('synth')),\n      F('Etiqueta do áudio', sel.audioLabel, patchTech('audioLabel'))\n    ] : [];\n    const techAreas = sel ? [\n      A('Descrição', sel.desc, patchTech('desc')),\n      A('Para compositores', sel.composer, patchTech('composer')),\n      A('Para oboístas', sel.oboist, patchTech('oboist')),\n      A('Curiosidade', sel.fun, patchTech('fun'))\n    ] : [];\n\n    const recOf = (id) => (d.recordings[id] || []);\n    const setRecOf = (id, arr) => this.upd((dd) => { if (arr.length) dd.recordings[id] = arr; else delete dd.recordings[id]; });\n\n    const subDefs = [\n      { id: 'detail', label: 'Detalhes' },\n      { id: 'rec', label: 'Gravações'
